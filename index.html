
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Tool Box - Resource Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #050607; 
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #00ff66; border-radius: 10px; }

        .qr-glow {
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            animation: qr-pulse 2s infinite;
        }
        @keyframes qr-pulse {
            0% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 102, 0.4); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #111218 25%, #1f2227 50%, #111218 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #project-notes:empty:before {
            content: attr(data-placeholder);
            color: #8a8f99;
            font-weight: 400;
        }
        #project-notes ul { list-style-type: disc; padding-left: 1.5rem; }
        #project-notes ol { list-style-type: decimal; padding-left: 1.5rem; }
        
        .ai-generated-box {
            animation: slideUp 0.4s cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .neon-glow:hover {
          box-shadow: 0 0 18px rgba(0, 255, 102, 0.4);
        }

        /* Accessibility focus rings */
        *:focus-visible {
          outline: 2px solid #00ff66 !important;
          outline-offset: 2px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gradient-to-b from-[#050607] to-[#111218] min-h-screen text-white selection:bg-[#00ff66] selection:text-[#050607]">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
